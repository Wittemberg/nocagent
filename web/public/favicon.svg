<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fundo com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Ondas de Rádio / NOC Signal -->
  <path d="M 12 32 A 20 20 0 0 1 52 32" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 18 32 A 14 14 0 0 1 46 32" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 24 32 A 8 8 0 0 1 40 32" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Núcleo Central Ativo (LED Verde / Radar) -->
  <circle cx="32" cy="32" r="5" fill="#10b981" filter="url(#glow)"/>
  
  <!-- Antena / Suporte de Conexão -->
  <path d="M 32 37 L 32 50" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 23 50 L 41 50" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
</svg>
