name: Build and Deploy NOC-Agent Core

on:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - '.github/workflows/docker-core.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Imagem Core
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: ghcr.io/wittemberg/nocagent-core:latest

      - name: Notificar Portainer via Webhook da Stack
        env:
          STACK_WEBHOOK: ${{ secrets.PORTAINER_STACK_WEBHOOK_URL }}
          SERVICE_WEBHOOK: ${{ secrets.PORTAINER_CORE_WEBHOOK_URL }}
        run: |
          WEBHOOK_URL="${STACK_WEBHOOK:-$SERVICE_WEBHOOK}"
          if [ -n "$WEBHOOK_URL" ]; then
            echo "🚀 Disparando webhook do Portainer..."
            RESPONSE=$(curl -sk -w "\nHTTP_STATUS:%{http_code}" -X POST "$WEBHOOK_URL")
            echo "$RESPONSE"
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Webhook aceito pelo Portainer com sucesso (Status: $HTTP_STATUS)!"
            else
              echo "⚠️ Portainer retornou código HTTP $HTTP_STATUS ao processar o webhook."
            fi
          else
            echo "⚠️ Nem PORTAINER_STACK_WEBHOOK_URL nem PORTAINER_CORE_WEBHOOK_URL foram configurados nos secrets."
          fi
