name: Build and Deploy NOC-Agent Web

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/docker-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Imagem Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ghcr.io/wittemberg/nocagent-web:latest

      - name: Notificar Portainer via Webhook
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEB_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK" ]; then
            echo "🚀 Disparando webhook do Portainer para o serviço WEB..."
            curl -sk -X POST "$PORTAINER_WEBHOOK"
            echo -e "\n✅ Webhook do WEB disparado com sucesso!"
          else
            echo "⚠️ PORTAINER_WEB_WEBHOOK_URL não configurado nos secrets do repositório."
          fi
